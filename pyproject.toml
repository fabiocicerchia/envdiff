[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envdiff"
version = "0.2.1"
description = "Diff env vars/configs between two running environments, with secret masking"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/envdiff"
Issues = "https://github.com/fabiocicerchia/envdiff/issues"
Changelog = "https://github.com/fabiocicerchia/envdiff/blob/main/CHANGELOG.md"

[project.scripts]
envdiff = "envdiff:main"

[tool.setuptools]
py-modules = ["envdiff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Import envdiff.py from the checkout. Without this, tests/ is the only path
# pytest prepends and `import envdiff` resolves to whatever is installed in
# site-packages — the suite then passes against code that is not in the tree.
pythonpath = ["."]
